name: Build Release
run-name: "Build Release for ${{ github.ref_name }}"

# 触发方式：推送 v* 标签（例如 v2.103.3-zh）
# 产物将作为正式版发布到对应的 GitHub Release，Release 标题自动去掉 -zh 后缀（例如 v2.103.3）。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 安装 GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # 该版本被固定不仅出于安全考虑，也是为了避免破坏依赖 GoReleaser 生成的特定文件名的脚本
          version: v2.13.1
          install-only: true
      - name: 创建正式版 tag 并构建制品
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          # 去掉末尾的 -zh（例如 v2.103.3-zh -> v2.103.3），作为纯正式版版本号
          RELEASE_TAG="${RAW_TAG%-zh}"
          # 若本地 tag 与目标一致则跳过创建，否则创建临时本地 tag 供 GoReleaser 注入版本号
          if [ "$RELEASE_TAG" != "$RAW_TAG" ]; then
            git tag "$RELEASE_TAG"
          fi
          sed -i 's#h1:IJ6lSr9WsVQeMWaSHlrlO11V26/NdkhSEjv/bOE8VeI#h1:RZuuSYhTvlDvtsK+NkutoCZ//C0X2ebLK8X8l3ULs84#g' go.sum
          script/release --local "$RELEASE_TAG" --platform linux --branch "$RAW_TAG"
      - name: 生成 man 手册
        run: |
          go run ./cmd/gen-docs --website --doc-path dist/manual
          tar -czvf dist/manual.tar.gz -C dist -- manual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 安装 GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # The version is pinned not only for security purposes, but also to avoid breaking
          # our scripts, which rely on the specific file names generated by GoReleaser.
          version: v2.13.1
          install-only: true
      - name: 创建正式版 tag 并构建制品
        shell: bash
        env:
          RAW_TAG: ${{ github.ref_name }}
          DO_SIGN_ARTIFACTS: "false"
        run: |
          # 去掉末尾的 -zh（例如 v2.103.3-zh -> v2.103.3），作为纯正式版版本号
          RELEASE_TAG="${RAW_TAG%-zh}"
          if [ "$RELEASE_TAG" != "$RAW_TAG" ]; then
            git tag "$RELEASE_TAG"
          fi
          sed -i 's#h1:IJ6lSr9WsVQeMWaSHlrlO11V26/NdkhSEjv/bOE8VeI#h1:RZuuSYhTvlDvtsK+NkutoCZ//C0X2ebLK8X8l3ULs84#g' go.sum
          script/release --local "$RELEASE_TAG" --platform windows --branch "$RAW_TAG"
      - name: 配置 MSBuild
        id: setupmsbuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: 构建 MSI 文件
        shell: bash
        env:
          MSBUILD_PATH: ${{ steps.setupmsbuild.outputs.msbuildPath }}
        run: |
          for ZIP_FILE in dist/gh_*_windows_*.zip; do
            MSI_NAME="$(basename "$ZIP_FILE" ".zip")"
            MSI_VERSION="$(cut -d_ -f2 <<<"$MSI_NAME" | cut -d- -f1)"
            case "$MSI_NAME" in
            *_386 )
              source_dir="$PWD/dist/windows_windows_386_sse2"
              platform="x86"
              ;;
            *_amd64 )
              source_dir="$PWD/dist/windows_windows_amd64_v1"
              platform="x64"
              ;;
            *_arm64 )
              source_dir="$PWD/dist/windows_windows_arm64_v8.0"
              platform="arm64"
              ;;
            * )
              printf "unsupported architecture: %s\n" "$MSI_NAME" >&2
              exit 1
              ;;
            esac
            "${MSBUILD_PATH}\MSBuild.exe" ./build/windows/gh.wixproj -p:SourceDir="$source_dir" -p:OutputPath="$PWD/dist" -p:OutputName="$MSI_NAME" -p:ProductVersion="${MSI_VERSION#v}" -p:Platform="$platform"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.zip
            dist/*.msi

  release:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: 代码检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 合并构建制品
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: 准备发布制品
        run: |
          shopt -s failglob
          rm -rf dist
          mkdir dist
          mv -v {linux,windows}/gh_* dist/
      - name: 发布正式发布版本
        env:
          RAW_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          RELEASE_TITLE="${RAW_TAG%-zh}"
          pushd dist
          shasum -a 256 gh_* > checksums.txt
          mv checksums.txt "gh_${RELEASE_TITLE#v}_checksums.txt"
          popd
          # 关联触发的 tag（如 v2.103.3-zh）创建正式版 Release，标题设为 v2.103.3
          script/label-assets dist/gh_* | xargs gh release create "$RAW_TAG" \
	        --title "$RELEASE_TITLE" \
	        --target "$GITHUB_SHA" \
            --notes "自动化 CI 构建和制品发布 (tag: ${RAW_TAG}, commit_id: ${GITHUB_SHA})"
