name: Build CI
run-name: "Build CI on ${{ github.ref_name }} (tag: build-ci)"

# 触发方式：推送 v* 分支（例如 v2.100.0、v2.100.0-rc.1）
# 产物统一发布到固定的预发布 Release（标签 build-ci），不进入正式发布页。
# 每次发布前会删除旧的 build-ci Release（含标签），避免制品叠加。

# 所有 v* 分支共用同一个预发布位（build-ci），因此串行化并让最新构建胜出，
# 避免多个分支同时写同一个 Release。
concurrency:
  group: ${{ github.workflow }}-build-ci
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 安装 GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # 该版本被固定不仅出于安全考虑，也是为了避免破坏依赖 GoReleaser 生成的特定文件名的脚本
          version: v2.13.1
          install-only: true
      - name: 创建临时 tag 并构建制品
        env:
          RAW_REF: ${{ github.ref_name }}
        run: |
          # 去掉末尾的 -zh 并拼接 7 位短提交 ID（例如 v2.103.3-a1b2c3d）
          BASE_TAG="${RAW_REF%-zh}-${GITHUB_SHA::7}"
          git tag "$BASE_TAG"
          sed -i 's#h1:IJ6lSr9WsVQeMWaSHlrlO11V26/NdkhSEjv/bOE8VeI#h1:RZuuSYhTvlDvtsK+NkutoCZ//C0X2ebLK8X8l3ULs84#g' go.sum
          script/release --local "$BASE_TAG" --platform linux --branch "$RAW_REF"
      - name: 生成 man 手册
        run: |
          go run ./cmd/gen-docs --website --doc-path dist/manual
          tar -czvf dist/manual.tar.gz -C dist -- manual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 安装 GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # The version is pinned not only for security purposes, but also to avoid breaking
          # our scripts, which rely on the specific file names generated by GoReleaser.
          version: v2.13.1
          install-only: true
      # 预发布构建不做代码签名，因此不需要 Azure 签名客户端与登录
      - name: 创建临时 tag 并构建制品
        shell: bash
        env:
          RAW_REF: ${{ github.ref_name }}
          DO_SIGN_ARTIFACTS: "false"
        run: |
          # 去掉末尾的 -zh 并拼接 7 位短提交 ID（例如 v2.103.3-a1b2c3d）
          BASE_TAG="${RAW_REF%-zh}-${GITHUB_SHA::7}"
          git tag "$BASE_TAG"
          sed -i 's#h1:IJ6lSr9WsVQeMWaSHlrlO11V26/NdkhSEjv/bOE8VeI#h1:RZuuSYhTvlDvtsK+NkutoCZ//C0X2ebLK8X8l3ULs84#g' go.sum
          script/release --local "$BASE_TAG" --platform windows --branch "$RAW_REF"
      - name: 配置 MSBuild
        id: setupmsbuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: 构建 MSI 文件
        shell: bash
        env:
          MSBUILD_PATH: ${{ steps.setupmsbuild.outputs.msbuildPath }}
        run: |
          for ZIP_FILE in dist/gh_*_windows_*.zip; do
            MSI_NAME="$(basename "$ZIP_FILE" ".zip")"
            MSI_VERSION="$(cut -d_ -f2 <<<"$MSI_NAME" | cut -d- -f1)"
            case "$MSI_NAME" in
            *_386 )
              source_dir="$PWD/dist/windows_windows_386_sse2"
              platform="x86"
              ;;
            *_amd64 )
              source_dir="$PWD/dist/windows_windows_amd64_v1"
              platform="x64"
              ;;
            *_arm64 )
              source_dir="$PWD/dist/windows_windows_arm64_v8.0"
              platform="arm64"
              ;;
            * )
              printf "unsupported architecture: %s\n" "$MSI_NAME" >&2
              exit 1
              ;;
            esac
            "${MSBUILD_PATH}\MSBuild.exe" ./build/windows/gh.wixproj -p:SourceDir="$source_dir" -p:OutputPath="$PWD/dist" -p:OutputName="$MSI_NAME" -p:ProductVersion="${MSI_VERSION#v}" -p:Platform="$platform"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.zip
            dist/*.msi

  release:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: 代码检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 合并构建制品
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: 准备发布制品
        run: |
          shopt -s failglob
          rm -rf dist
          mkdir dist
          mv -v {linux,windows}/gh_* dist/
      # 删除上一次的预发布，避免制品叠加；--cleanup-tag 同时删除 build-ci 标签。
      # 若只剩标签而 Release 已不存在，再显式删除远端标签，否则下面的 create 会冲突。
      - name: 删除旧预发布版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete build-ci --yes --cleanup-tag || true
          git push origin ":refs/tags/build-ci" || true
      - name: 创建预发布版本
        env:
          RAW_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          BASE_TAG="${RAW_REF%-zh}-${GITHUB_SHA::7}"
          pushd dist
          shasum -a 256 gh_* > checksums.txt
          mv checksums.txt "gh_${BASE_TAG#v}_checksums.txt"
          popd
          script/label-assets dist/gh_* | xargs gh release create build-ci \
            --title "Build CI on ${RAW_REF} (${GITHUB_SHA::7})" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "自动化 CI 构建和制品预发布 (branch: ${RAW_REF}, commit_id: ${GITHUB_SHA})"
